<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Notes" />
  <title>Mon App de Notes</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="icon-button" id="closeSidebarBtn" aria-label="Fermer le menu">×</button>
        <button class="icon-button" id="folderMenuBtn" aria-label="Options des dossiers">⋮</button>
      </div>

      <div class="folder-actions" id="folderActions">
        <button type="button" id="createFolderBtn">Créer un dossier</button>
        <button type="button" id="renameFolderBtn">Renommer le dossier</button>
      </div>

      <nav class="menu">
        <button class="menu-item active" data-filter="all">
          <span class="menu-icon">▣</span>
          <span>Toutes les notes 2.1</span>
          <span class="menu-count" id="allCount">0</span>
        </button>

        <button class="menu-item" data-filter="folders">
          <span class="menu-icon">▰</span>
          <span>Dossiers</span>
          <span class="menu-count" id="folderMenuCount">0</span>
        </button>

        <button class="menu-item" data-filter="favorites">
          <span class="menu-icon">☆</span>
          <span>Favoris</span>
          <span class="menu-count" id="favCount">0</span>
        </button>

        <button class="menu-item" data-filter="locked">
          <span class="menu-icon">🔒</span>
          <span>Notes verrouillées</span>
          <span class="menu-count" id="lockedCount">0</span>
        </button>

        <button class="menu-item" data-filter="trash">
          <span class="menu-icon">🗑</span>
          <span>Corbeille</span>
          <span class="menu-count" id="trashCount">0</span>
        </button>
      </nav>

      <div class="divider"></div>

      <section class="folders-section">
        <div class="folders-title">
          <span>▾</span>
          <strong>Dossiers</strong>
          <span class="menu-count" id="folderCount">0</span>
        </div>

        <div class="folder-list" id="folderList"></div>
      </section>
    </aside>

    <div class="overlay" id="overlay"></div>

    <!-- Main screen -->
    <main class="main-screen">
      <header class="top-header">
        <h1 id="pageTitle">Toutes les notes 2.1</h1>
        <p id="pageSubtitle">0 notes</p>
      </header>

      <div class="toolbar">
        <button class="toolbar-button" id="openSidebarBtn" aria-label="Ouvrir le menu">☰</button>

        <div class="breadcrumb">
          <span class="home-icon">⌂</span>
          <span>›</span>
          <span id="breadcrumbFolder">Toutes les notes 2.1</span>
        </div>

        <button class="toolbar-button" id="searchBtn" aria-label="Rechercher">⌕</button>
        <button class="toolbar-button" id="viewOptionsBtn" aria-label="Options d'affichage">⋮</button>
      </div>

      <div class="search-panel" id="searchPanel">
        <input type="search" id="searchInput" placeholder="Rechercher une note..." />
      </div>

      <section class="view-panel" id="viewPanel" aria-label="Personnalisation de l'affichage">
        <div class="view-section">
          <h2>Trier</h2>
          <div class="view-control">
            <label for="sortBySelect">Trier par</label>
            <select id="sortBySelect">
              <option value="updatedAt">Modification</option>
              <option value="createdAt">Creation</option>
              <option value="title">Alphabetique</option>
            </select>
          </div>

          <div class="view-control">
            <label for="sortDirectionSelect">Ordre</label>
            <select id="sortDirectionSelect">
              <option value="desc">Decroissant</option>
              <option value="asc">Croissant</option>
            </select>
          </div>
        </div>

        <div class="view-section">
          <h2>Afficher</h2>
          <div class="view-control">
            <label for="viewModeSelect">Vue</label>
            <select id="viewModeSelect">
              <option value="grid">Grille</option>
              <option value="list">Liste</option>
              <option value="compact">Compact</option>
              <option value="gallery">Galerie</option>
              <option value="detail">Detail</option>
            </select>
          </div>

          <div class="view-control view-range-control">
            <label for="cardSizeRange">Taille <span id="cardSizeValue">1</span></label>
            <input id="cardSizeRange" type="range" min="1" max="100" step="1" />
          </div>

          <div class="view-control">
            <label for="cardStyleSelect">Style</label>
            <select id="cardStyleSelect">
              <option value="paper">Papier</option>
              <option value="flat">Plat</option>
              <option value="soft">Doux</option>
            </select>
          </div>

          <label class="view-toggle">
            <input type="checkbox" id="showPreviewToggle" />
            <span>Apercu</span>
          </label>

          <label class="view-toggle">
            <input type="checkbox" id="showDateToggle" />
            <span>Date</span>
          </label>

          <label class="view-toggle">
            <input type="checkbox" id="groupByMonthToggle" />
            <span>Mois</span>
          </label>
        </div>
      </section>

      <section class="notes-area" id="notesArea"></section>

      <button class="add-note-button" id="addNoteBtn" aria-label="Créer une note">✎</button>
    </main>

    <input class="image-input" id="coverInput" type="file" accept="image/*" />

    <section class="note-action-sheet" id="noteActionSheet" aria-hidden="true">
      <div class="note-action-panel">
        <div class="note-action-title" id="noteActionTitle">Note</div>
        <button type="button" id="coverNoteBtn">Ajouter une couverture</button>
        <div class="cover-position-controls" id="coverPositionControls" aria-label="Cadrage de la couverture">
          <button type="button" data-cover-position="50% 0%">Haut</button>
          <button type="button" data-cover-position="50% 50%">Centre</button>
          <button type="button" data-cover-position="50% 100%">Bas</button>
          <button type="button" data-cover-position="0% 50%">Gauche</button>
          <button type="button" data-cover-position="100% 50%">Droite</button>
        </div>
        <button type="button" id="removeCoverBtn">Retirer la couverture</button>
        <button type="button" class="danger" id="deleteSelectedNoteBtn">Supprimer</button>
        <button type="button" id="closeNoteActionBtn">Annuler</button>
      </div>
    </section>

    <!-- Editor modal -->
    <section class="editor-modal" id="editorModal" aria-hidden="true">
      <div class="editor-card">
        <div class="editor-header">
          <button class="editor-icon-button" id="cancelEditBtn" aria-label="Fermer l'editeur">&#8592;</button>
          <div class="editor-header-actions">
            <button class="editor-icon-button" id="favoriteBtn" aria-label="Ajouter aux favoris">&#9734;</button>
            <button class="editor-icon-button danger" id="deleteBtn" aria-label="Supprimer la note">&#128465;</button>
            <button class="editor-icon-button" aria-label="Plus d'options">&#8942;</button>
          </div>
        </div>

        <select class="hidden-field" id="noteFolderSelect" aria-label="Dossier de la note"></select>

        <div class="editor-tools" aria-label="Outils d'ecriture">
          <button class="tool-button" type="button" data-action="heading" aria-label="Titre">T</button>
          <button class="tool-button" type="button" data-action="checklist" aria-label="Case a cocher">&#9745;</button>
          <button class="tool-button" type="button" data-action="bold" aria-label="Gras">B</button>
          <button class="tool-button italic" type="button" data-action="italic" aria-label="Italique">I</button>
          <button class="tool-button" type="button" data-action="image" aria-label="Image">&#9634;</button>
          <button class="tool-button" type="button" data-action="copy" aria-label="Bloc copier">&#10697;</button>
          <button class="tool-button" type="button" data-action="divider" aria-label="Separateur">&#43;</button>
        </div>

        <div class="editor-writing-surface">
          <input class="note-title-input" id="noteTitleInput" placeholder="Titre" />
          <div
            class="note-content-input"
            id="noteContentInput"
            contenteditable="true"
            data-placeholder="Commence a ecrire..."
            role="textbox"
            aria-label="Contenu de la note"
          ></div>
        </div>

        <input class="image-input" id="imageInput" type="file" accept="image/*" multiple />
        <div class="image-controls" id="imageControls" aria-label="Options de l'image">
          <button type="button" data-image-action="small">Petit</button>
          <button type="button" data-image-action="medium">Moyen</button>
          <button type="button" data-image-action="full">Large</button>
          <button type="button" data-image-action="delete">Supprimer</button>
        </div>
      </div>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
